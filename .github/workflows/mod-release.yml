name: Mod release

# One shared gatOS archive, following unscience's Borea-compatible release policy.
# main -> 1.<run>.0 stable; feature/* -> 1.<run>.0-beta prerelease.
# Other refs and PRs build/validate only. Keep this workflow file to retain its counter.
# Windows QEMU is always included; Linux ignores it and uses system QEMU.
# build.yml independently runs the full test suite, including GATOS_IT=1.
on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
    paths-ignore:
      - 'site/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

# One in-flight build per ref; a newer push supersedes an older run.
concurrency:
  group: mod-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      channel: ${{ steps.meta.outputs.channel }}
    env:
      # Directory.Build.props resolves these before any per-OS defaults.
      KSA_DLL_DIR: ${{ github.workspace }}/.tmp/ksa-game-assemblies/current/dll
      GATOS_DIST_DIR: ${{ github.workspace }}/.tmp/dist
    steps:
      - name: Checkout gatOS
        uses: actions/checkout@v6

      - name: Checkout private KSA assemblies
        uses: actions/checkout@v6
        with:
          repository: meow-sci/ksa-game-assemblies
          path: .tmp/ksa-game-assemblies
          token: ${{ secrets.KSA_GAME_ASSEMBLIES_PAT }}
          persist-credentials: false
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify release policy
        run: |
          python3 tools/check-release-policy.py
          python3 tools/check-dist-tests.py
          python3 tools/check-guest-release.py

      # Branch-derived values are validated here and consumed by later steps
      # via env:, never interpolated raw into run scripts (a ref name can
      # contain shell/sed metacharacters; this job has contents: write).
      - name: Compute release metadata
        id: meta
        run: bash tools/release-metadata.sh

      # The version users see in-game / in mod.toml matches the release.
      # MODVERSION is validated above to [0-9A-Za-z._-]+, so it cannot contain
      # the sed delimiter or replacement metacharacters.
      - name: Stamp mod version
        if: steps.meta.outputs.publish == 'true'
        env:
          MODVERSION: ${{ steps.meta.outputs.modversion }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$MODVERSION\"/" gatOS.GameMod/mod.toml
          grep '^version' gatOS.GameMod/mod.toml

      - name: Verify KSA references
        run: test -s "$KSA_DLL_DIR/KSA.dll"

      # Full 7-Zip (7zz) can extract the pinned NSIS Windows installer on Linux.
      - name: Install 7-Zip
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends 7zip

      - name: Fetch pinned Windows QEMU
        run: tools/fetch-qemu.sh

      - name: Fetch pinned guest image
        env:
          GH_TOKEN: ${{ github.token }}
        run: guest/fetch-guest.sh

      # GameMod's existing CopyCustomContent assembles the shared mod folder.
      - name: Build solution
        run: dotnet build gatos.slnx -c Release --nologo -v quiet

      - name: Validate single-mod distribution
        env:
          MODVERSION: ${{ steps.meta.outputs.modversion }}
        run: python3 tools/check-dist.py "$GATOS_DIST_DIR" --version "$MODVERSION"

      - name: Package
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd "$GATOS_DIST_DIR"
          zip -qr "gatOS-$VERSION.zip" gatOS
          unzip -tq "gatOS-$VERSION.zip"
          du -h "gatOS-$VERSION.zip"

      - name: Publish release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash tools/publish-release.sh

  prune:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cleanup is serialized per channel; beta branches share one retention pool.
    concurrency:
      group: rolling-release-cleanup-${{ needs.build.outputs.channel }}
      cancel-in-progress: false
    steps:
      - name: Checkout retention policy
        uses: actions/checkout@v6

      # Keep 10 main releases and 5 betas. Historical and guest releases are protected.
      # Fetch every page so retention is not capped at 200 entries.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          case "$CHANNEL" in
            main) KEEP=10 ;;
            feature) KEEP=5 ;;
            *) echo "Unknown release channel: $CHANNEL" >&2; exit 1 ;;
          esac
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 tools/release-retention.py --channel "$CHANNEL" --keep "$KEEP" \
            > "$RUNNER_TEMP/gatOS-stale-releases.txt"
          while IFS= read -r tag; do
            echo "Pruning $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < "$RUNNER_TEMP/gatOS-stale-releases.txt"
