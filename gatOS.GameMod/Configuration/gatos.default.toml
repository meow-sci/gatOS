# gatOS configuration.
#
# The mod ships a template, gatos.default.toml, in its folder — edit it to set the common
# options (memory, CPUs, disk) before you ever launch the game. On first launch gatOS copies
# it to gatos.toml and from then on reads and writes gatos.toml (your live config, which
# survives mod updates); in-game changes are saved there too. Delete gatos.toml to restore
# every default. Out-of-range values are clamped (and logged), not rejected.
#
# Common settings are grouped first; the advanced surface follows.

schema = 1

# ===== COMMON — most players only need to touch these =====

# Guest RAM in MiB. Bump it if you install heavy software.
memory_mb = 256

# Guest virtual CPU count.
cpus = 2

# Guest disk size in GiB (clamped 1..128). Grow-only: raising it expands the active
# save's disk on the next boot; lowering it is a no-op (use Reset Disk to reclaim space).
disk_size_gb = 8

# true = guest gets no internet, only the gatOS channels (off = wan works visa host network).
restrict_network = false

# Force one accelerator: "whpx" | "kvm" | "hvf" | "tcg" ("" = auto ladder).
accel_override = ""

# Override the guest CPU model ("" = auto; WHPX needs a named model, not host).
cpu_model = ""

# Overall boot timeout in seconds; 0 = automatic (60 s accelerated / 300 s TCG).
boot_timeout_seconds = 0

# ===== TELEMETRY — the /sim data feed (all tunable live in-game) =====

# Master /sim sampling rate in Hz (clamped 1..120; retune live in-game).
sample_rate_hz = 10

# Master gate for sampling (false = /sim freezes; VM and shells unaffected).
telemetry_enabled = true

# Sample per-vessel detail (navball/environment/per-module); off = core only.
telemetry_vessel_detail = true

# Sample the per-vessel top-level parts list (/sim/.../parts; the welds anchor picker).
telemetry_vessel_parts = true

# Sample the celestial-body catalog + system summary (/sim/bodies, /sim/system).
telemetry_bodies = true

# Bodies resample cadence in Hz (0 = every sample tick). Below the master rate, the
# ticks between re-publish the same bodies/system data — cheaper, slightly staler.
telemetry_bodies_rate_hz = 0

# Diff snapshots into /sim/events entries (and the event topics/streams).
telemetry_events = true

# ===== CONTROL — the /sim write surface =====

# Master switch for all /sim writes (false = every control write EACCES).
control_enabled = true

# true = command any vessel; false = only the active vessel.
control_all_vessels = true

# Expose the /sim/debug cheat surface (teleport / refuel / warp / switch vessel).
debug_namespace = true

# How long a control write waits for the game thread before ETIMEDOUT.
command_timeout_ms = 2000

# Upper bound on control commands executed per game frame.
max_commands_per_frame = 64

# ===== TRANSPORTS — HTTP, MQTT, serial & bus bridges =====

# Serve the magic HTTP API (guest reaches it at $GATOS_HTTP / 10.0.2.2).
http_enabled = true

# Host IP to bind the HTTP API to (127.0.0.1 = host-local; 0.0.0.0 = all IPv4 interfaces).
http_bind_host = '127.0.0.1'

# Preferred HTTP port (4242); 0 = ephemeral only; falls back on a clash.
http_preferred_port = 4242

# Serve the per-field /v1/fs/<path> filesystem mirror (reads + SSE + writes).
http_field_endpoints = true

# Serve the host-side MCP API for AI agents.
mcp_enabled = true

# Host IP to bind the MCP API to (127.0.0.1 = host-local; 0.0.0.0 = all IPv4 interfaces).
mcp_bind_host = '127.0.0.1'

# Preferred MCP port (4243); 0 = ephemeral only; falls back on a clash.
mcp_preferred_port = 4243

# Run the embedded MQTT broker (guest reaches it at $GATOS_MQTT / 10.0.2.2).
mqtt_enabled = true

# Host IP to bind MQTT to (127.0.0.1 = host-local; 0.0.0.0 = all IPv4 interfaces).
mqtt_bind_host = '127.0.0.1'

# Preferred MQTT port (1883); 0 = ephemeral only; falls back on a clash.
mqtt_preferred_port = 1883

# Publish the per-field gatos/sim/<path> filesystem mirror (one topic per leaf).
mqtt_field_topics = true

# Cap on the MQTT world-topic cadence in Hz (0 = every snapshot). Below the sample
# rate the broker coalesces to the newest snapshot — cheaper at high sample rates.
mqtt_publish_hz = 0

# Cadence of the MQTT field mirror in Hz (default 4; clamped 1..30).
field_feed_hz = 4

# Stream telemetry out over the gatos.serial virtio-serial port.
serial_telemetry_port = false

# Accept SCPI command lines in over the gatos.serial virtio-serial port.
serial_command_port = false

# Serial telemetry wire format: ndjson | nmea | ccsds (default ndjson).
serial_mode = "ndjson"

# Serial telemetry cadence in milliseconds (default 500; clamped 50..60000).
serial_interval_ms = 500

# Expose a CCSDS space-packet TM/TC feed (reserved — not yet served).
bus_ccsds = false

# Expose a MIL-STD-1553 BC/RT framing feed (reserved — not yet served).
bus_1553 = false

# ===== DISPLAY — the screen stream (/sim/display; all tunable live over /sim) =====

# Boot seed for /sim/display/enabled. OFF by default; turn it on live with
# `echo 1 > /sim/display/enabled` (and `echo 0 >` to stop). Capture costs nothing while off.
display_enabled = false

# Stream cadence in Hz (clamped 1..60), decoupled from the game frame rate.
display_fps = 15

# Downscale target width in pixels (clamped 16..1920).
display_width = 320

# Downscale target height in pixels (clamped 16..1920).
display_height = 180

# Frame wire encoding: rgba-zlib (default; 3-10x smaller on the wire) | rgba
# (raw fallback). rgba-zlib needs purrTTY's 2026-07-02+ native — older pins crash
# on compressible o=z payloads (purrtty gotcha 34, fixed).
display_encoding = "rgba-zlib"

# ===== PAINT — opt-in vehicle shaders and EVA material clones (/sim/paint) =====

# Boot seed only. false means no shader compiler or part-render patches are installed.
paint_parts_enabled = false

# Boot seed only. false means no EVA material arrays are rebound and no GPU clones exist.
paint_kittens_enabled = false

# Hard limit on gatOS-owned material clones (the game's material pool is fixed at 512).
paint_max_material_clones = 64

# Whether /sim/paint/textures exists at all. false removes the subtree entirely.
paint_textures_enabled = true

# Per-upload byte cap (EFBIG past it; clamped 64 KiB..256 MiB).
paint_texture_max_bytes = 16777216

# Store-wide upload byte cap, committed + uploading (ENOSPC; clamped >= per-file cap).
paint_texture_max_total_bytes = 134217728

# Uploaded image count cap (ENOSPC; clamped 1..256).
paint_texture_max_files = 32

# Simultaneous texture override cap (ENOSPC; clamped 1..256).
paint_texture_max_bindings = 32

# Longest GPU edge kept for an override; larger uploads are downscaled, not rejected (16..16384).
paint_texture_max_dimension = 4096

# Whether /sim/paint/stickers exists at all. false removes the subtree entirely.
paint_stickers_enabled = true

# Maximum simultaneous sticker decals (clamped 1..4096).
paint_stickers_max_count = 256

# Metres past which a sticker is not drawn at all (clamped 10..1000000).
paint_stickers_max_view_distance_m = 5000.0

# ===== AUDIO — userland playback through the game's speakers (/sim/audio) =====

# Serve /sim/audio: upload clips (cat x.mp3 > /sim/audio/file/x.mp3) and play
# them through the game's FMOD mixer. false removes the surface entirely.
audio_enabled = true

# Per-clip size cap in bytes (a write past it fails EFBIG).
audio_max_clip_bytes = 16777216

# Store-wide byte cap across all clips (uploads past it fail ENOSPC).
audio_max_total_bytes = 67108864

# Maximum number of uploaded clips (ENOSPC past it).
audio_max_clips = 64

# Maximum concurrent playback channels (play past it fails EBUSY).
audio_max_channels = 16

# ===== CAMERA — programmable cinematic camera (/sim/camera) =====

# Serve /sim/camera: take the camera, fly it, follow and frame things, then
# hand it back. false removes the surface entirely.
camera_enabled = true

# Maximum uploaded camera tracks (ENOSPC past it).
camera_max_tracks = 32

# Per-track JSON size cap in bytes (an upload past it fails EFBIG).
camera_max_track_bytes = 1048576

# Store-wide byte cap across all tracks (uploads past it fail ENOSPC).
camera_max_total_bytes = 8388608

# Maximum keyframes per animated channel (EINVAL past it).
camera_max_keys = 4096

# Lower field-of-view bound in degrees — deliberately wider than the game's own
# 15, since the engine's SetFieldOfView is unclamped.
camera_fov_min = 1.0

# Upper field-of-view bound in degrees — deliberately wider than the game's own
# 120, so telephoto shots are available.
camera_fov_max = 179.0

# Default eased hand-back in seconds when the director releases the camera
# (the game's own CameraJumpTime default is 0.6).
camera_release_blend_s = 0.6

# Allow camera tracks to drive simulation speed; additionally requires
# debug_namespace.
camera_allow_time_channel = true

# ===== SCHEDULE — host-side timed command sequences (/sim/ctl/timed_batch) =====

# Serve /sim/ctl/timed_batch + /sim/ctl/schedules: any control leaf, any time
# offset, replayed host-side. false removes both entirely.
schedule_enabled = true

# Maximum concurrent live schedules (EINVAL past it).
schedule_max_live = 16

# Maximum timed entries per schedule (EINVAL past it).
schedule_max_entries = 8192

# Per-schedule buffered payload cap in bytes (EINVAL past it).
schedule_max_bytes = 1048576

# Clock base for a schedule that does not declare @clock: render (frames) |
# wall (host time) | ut (simulation time, so warp scales it).
schedule_default_clock = "render"

# ===== IVA — free-floating cabin objects (/sim/debug/iva; all tunable live over /sim) =====

# Boot seed for /sim/debug/iva/enabled — the master switch for the whole cabin-physics
# feature. OFF by default, and off means off: no physics simulation, no interior
# collision mesh, no per-frame work. Turn it on live with
# `echo 1 > /sim/debug/iva/enabled` (and `echo 0 >` to release everything and stop).
iva_physics_enabled = false

# Keep simulating when no viewport is in the IVA camera. Off = leaving IVA parks the
# objects (velocities zeroed, poses frozen) until you come back.
iva_run_outside_iva = false

# Cap on floating objects per vessel (an adopt past it fails EBUSY).
iva_max_objects = 16

# Largest bounding-box extent, metres, a SubPart may have and still be adoptable — the
# guard that stops adopt_all (or a mistyped id) cutting a hull panel or a seat loose.
iva_max_object_size = 0.5

# Density used to derive an object's mass from its collision-proxy volume.
iva_density_kg_m3 = 300.0

# Hard velocity clamp, m/s — the anti-tunnelling guard for thin art meshes.
iva_max_speed = 15.0

# Contact friction coefficient; higher makes a settled object stay put.
iva_friction = 0.6

# Bounciness, as the maximum contact recovery velocity in m/s.
iva_restitution = 1.0

# Fixed integration rate, Hz. A variable-dt contact sim is not stable.
iva_substep_hz = 120

# Substep budget per frame — the post-hitch catch-up bound.
iva_max_substeps_per_frame = 8

# Emit every interior triangle in both windings, so an object cannot fall through a wall
# whose art happens to wind outward. On by default; off halves the triangle count.
iva_double_sided_interior = true

# Speed change (m/s) in one substep that fires an iva.impact event.
iva_impact_speed = 0.4

# ===== MOUNTS — host folders shared into the guest under /mnt/<name> =====

# Off by default. Each [[mounts]] entry shares a host folder into the guest at /mnt/<name>,
# over the same channel as /sim. read_only = true (the default) lets the guest read but not
# change your files; read_only = false grants full read-write passthrough to the real folder
# — the guest can create, edit, delete and rename host files, so enable it deliberately.
# Hand-edit these before launch (no in-game UI); changes take effect on the next launch.
#
# [[mounts]]
# name = "scripts"             # shows up as /mnt/scripts in the guest
# path = "C:/Users/you/ksa"    # the host folder (forward slashes are fine on Windows)
# read_only = true
