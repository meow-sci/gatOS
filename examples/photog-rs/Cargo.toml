[package]
name = "photog-rs"
version = "0.1.0"
edition = "2021"
description = "Cinematic camera project editor for the gatOS /sim API"
license = "MIT"
publish = false

[lib]
name = "photog"
path = "src/lib.rs"

[[bin]]
name = "photog-rs"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
